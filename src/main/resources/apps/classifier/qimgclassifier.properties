# -----------------------------------------------------------------------------
# QImgClassifier application configuration.
#
# Every key is required (question.filter may be blank). Any key can be
# overridden at launch with a JVM system property of the same name, e.g.
#   -Dquestion.filter=C
# The AI models, gateways and their limits are configured in
# qimgclassifier.ai.json (another file: -Dai.app.config=<file>).
# Paths may start with ~/ for the user's home directory; the files the
# application keeps may be given relative to workspace.dir.
# -----------------------------------------------------------------------------

# ---- Question bank ----------------------------------------------------------

# Root folder searched (recursively) for the source folders listed in
# qclassifier.sources.txt.
question.bank.dir = /Users/sandeep/Documents/StudyNotes/question-bank

# Debug filter on question ids: blank for all questions, a single letter for
# one subject (P, C or M), otherwise an exact base or part id (e.g. C_SCA_74).
question.filter =

# Folder holding everything the application keeps: the files below (given
# relative to it) and the AI request / response transcripts, saved per attempt
# as <workspace.dir>/<source>/<questionId>/<time>-a<attempt>-<agent>-request.txt
# (and -response.txt) and shown in the transcript panel when a question is
# selected. Created at startup if missing.
workspace.dir = ~/projects/workspace/qimgclassifier

# Sources whose every question has been classified, one per line. Maintained
# by the application.
processed.list.file = processed.list

# Start times of the requests made today (UTC day), per gateway and model with
# a per-day limit (rpd > 0), so the daily counts survive a restart.
# Maintained by the application; older entries are removed automatically.
request.history.file = request.history.json

# One CSV row per AI attempt: question, subject, model, outcome and the tokens
# it used (input, cached, output, reasoning, cost) - for estimating what a
# paid model would cost. Appended by the application.
usage.log.file = token-usage.csv

# ---- QImgExtractor ----------------------------------------------------------

# Base URL of the running QImgExtractor's remote command API, used by
# "Show in QImgExtractor".
qimgextractor.api.url = http://127.0.0.1:8082
