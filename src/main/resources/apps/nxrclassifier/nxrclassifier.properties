# -----------------------------------------------------------------------------
# NXRClassifier configuration: labels the questions on the SConsole server
# N (numeric), X (reasoning) or R (recall) with a local classifier and the
# user's overrides, and saves the labels on the server. The questions the
# classifier leaves undecided may be sent to an AI model, configured apart in
# nxrclassifier.ai.json.
#
# Every key is required. Any key can be overridden at launch with a JVM
# system property of the same name, e.g.
#   -Dnxr.batch.size=20
# Paths may start with ~/ for the user's home directory; the files the app
# keeps may be given relative to workspace.dir.
# -----------------------------------------------------------------------------

# ---- SConsole server --------------------------------------------------------

#server.url = http://localhost:8080
server.url = http://192.168.0.161:8080/

# Seconds to wait for a connection, and for a whole request to complete.
server.connect.timeout.seconds = 5
server.request.timeout.seconds = 60

# ---- What to load -----------------------------------------------------------

# Questions fetched per Load (1-100), until changed in the app. The server
# always returns the first unlabelled questions by id: labelled ones drop
# out, so the next fetch brings the ones after them.
nxr.batch.size = 50

# ---- Classifier -------------------------------------------------------------
#
# See docs/feature-enhancements/2026-10-30/nxr-classifier/feature-design.md.

# The trained model the classifier loads at startup, kept in the source tree
# beside this file. A relative path is taken from the folder the app is
# started in (the project's root).
nxr.model.file = src/main/resources/apps/nxrclassifier/nxr-model.json

# The tesseract executable it runs for OCR (brew install tesseract).
nxr.tesseract.bin = /opt/homebrew/bin/tesseract

# Questions classified at once (1-16), each with its own tesseract process.
nxr.classify.threads = 5

# ---- Files ------------------------------------------------------------------

# Root folder searched (recursively) for the source folders holding the
# question images.
question.bank.dir = /Users/sandeep/Documents/StudyNotes/question-bank

# Folder holding everything the app keeps (the files below, given relative
# to it). Created at startup if missing.
workspace.dir = ~/projects/workspace/nxrclassifier

# Every label the server took, one JSON object per line, only ever appended
# to. For audit; the app never reads it.
nxr.audit.file = nxr-audit.jsonl

# Request times of the current UTC day, behind the AI models' per-day limits.
request.history.file = request.history.json

# One row per AI attempt with its token counts and cost.
usage.log.file = token-usage.csv
