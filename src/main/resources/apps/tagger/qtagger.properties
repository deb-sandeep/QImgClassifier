# -----------------------------------------------------------------------------
# QTagger configuration: associates diagnostic tags with the questions of the
# SConsole bank, one topic at a time, in one of two passes chosen at launch
# (or with -Dtagger.pass=setup|concept): setup tags every question's setup
# axis, read by one model; concept tags the concept and math axes and the
# dependencies of the questions in an exam, through a two-tier model cascade
# gated by a blind solve checked against the answer key. Each pass' models
# are configured in qtagger.<pass>.ai.json (another file:
# -Dai.app.config=<file>).
#
# Every key is required. Any key can be overridden at launch with a JVM
# system property of the same name, e.g.
#   -Dserver.url=http://192.168.0.161:8080
# Paths may start with ~/ for the user's home directory; the files that hold
# a pass' state (scope, pending replies, audit log, notes, token usage) may
# be given relative to the pass' folder in workspace.dir (setup/, concept/),
# the request history relative to workspace.dir.
# -----------------------------------------------------------------------------

# ---- SConsole server --------------------------------------------------------

#server.url = http://localhost:8080
server.url = http://192.168.0.161:8080/

# Seconds to wait for a connection, and for a whole request to complete.
server.connect.timeout.seconds = 5
server.request.timeout.seconds = 60

# ---- Files ------------------------------------------------------------------

# Root folder searched (recursively) for the source folders holding the
# question images.
question.bank.dir = /Users/sandeep/Documents/StudyNotes/question-bank

# The topic prompts, in the source tree (not the classpath): Generate and
# Approve write there, and a tuned file takes effect without a rebuild.
# Laid out as <syllabus>/<topic id>-<topic name>/<pass>-tags.generated.prompt
# and <pass>-tags.reviewed.prompt, beside each pass' template
# qtagger.<pass>.prompt (and qtagger.concept.axes.prompt). A relative path is
# taken from the folder the tagger is started in (the project's root).
prompts.dir = src/main/resources/prompts

# Folder holding everything the tagger keeps: the request history, and a
# folder per pass (setup/, concept/) with the pass' files below (given
# relative to it) and its AI request / response transcripts, saved per
# attempt as <workspace.dir>/<pass>/<source>/<questionId>/
# <time>-a<attempt>-openrouter-request.txt (and -response.txt), so each pass
# shows only its own. Separate from the classifier's and the reviewer's.
# Created at startup if missing.
workspace.dir = ~/projects/workspace/qtagger

# The pass' scope last chosen (topic, batch size, tag mode) and its load
# cursors (own questions, and in the concept pass dependents).
scope.file = tagger-scope.json

# Per question (by server id): the tiers' parsed replies and the state they
# led to, kept until the question's tags are saved on the server. A question
# with replies here is not sent to the models again while its topic (and, in
# the concept pass, its key) is unchanged.
pending.tagging.file = pending-tagging.json

# Every judgement and every saved decision, one JSON object per line, only
# ever appended to. For audit; the tagger never reads it.
tag.audit.file = tag-audit.jsonl

# Gap proposals and their fate, and deferrals, one JSON object per line, for
# the tag design work.
tagger.notes.file = tagger-notes.jsonl

# Start times of the requests made today (UTC day), so the daily count
# survives a restart. Maintained by the tagger.
request.history.file = request.history.json

# One CSV row per AI attempt with the tokens it used and its cost, per pass
# so each pass' cost reads on its own.
usage.log.file = token-usage.csv

# ---- Images -----------------------------------------------------------------

# Width in pixels a question's image is scaled down to before it is sent, if
# wider; 0 sends it as it is.
image.prep.width = 0

# Send the image in greyscale.
image.prep.greyscale = false
