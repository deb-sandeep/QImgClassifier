# -----------------------------------------------------------------------------
# QTagger configuration: associates diagnostic tags with the questions of the
# SConsole bank, one topic at a time, through a two-tier model cascade gated
# by a blind solve checked against the answer key. The models are configured
# in qtagger.ai.json (another file: -Dai.app.config=<file>).
#
# Every key is required. Any key can be overridden at launch with a JVM
# system property of the same name, e.g.
#   -Dserver.url=http://192.168.0.161:8080
# Paths may start with ~/ for the user's home directory; the files the tagger
# keeps may be given relative to workspace.dir.
# -----------------------------------------------------------------------------

# ---- SConsole server --------------------------------------------------------

server.url = http://localhost:8080

# Seconds to wait for a connection, and for a whole request to complete.
server.connect.timeout.seconds = 5
server.request.timeout.seconds = 60

# ---- Files ------------------------------------------------------------------

# Root folder searched (recursively) for the source folders holding the
# question images.
question.bank.dir = /Users/sandeep/Documents/StudyNotes/question-bank

# The topic prompts, in the source tree (not the classpath): Generate and
# Approve write there, and a tuned file takes effect without a rebuild.
# Laid out as <syllabus>/<topic id>-<topic name>/tags.generated.prompt and
# tags.reviewed.prompt, beside the shared template qtagger.prompt. A relative path is
# taken from the folder the tagger is started in (the project's root).
prompts.dir = src/main/resources/prompts

# Folder holding everything the tagger keeps: the files below (given
# relative to it) and the AI request / response transcripts, saved per attempt
# as <workspace.dir>/<source>/<questionId>/<time>-a<attempt>-openrouter-request.txt
# (and -response.txt). Separate from the classifier's and the reviewer's.
# Created at startup if missing.
workspace.dir = ~/projects/workspace/qtagger

# The scope last chosen (topic, batch size, tag mode) and the two load
# cursors (own questions, dependents).
scope.file = tagger-scope.json

# Per question (by server id): the tiers' parsed replies and the state they
# led to, kept until the question's tags are saved on the server. A question
# with replies here is not sent to the models again while its key and topic
# are unchanged.
pending.tagging.file = pending-tagging.json

# Every judgement and every saved decision, one JSON object per line, only
# ever appended to. For audit; the tagger never reads it.
tag.audit.file = tag-audit.jsonl

# Gap proposals and their fate, and deferrals, one JSON object per line, for
# the tag design work.
tagger.notes.file = tagger-notes.jsonl

# Start times of the requests made today (UTC day), so the daily count
# survives a restart. Maintained by the tagger.
request.history.file = request.history.json

# One CSV row per AI attempt with the tokens it used and its cost.
usage.log.file = token-usage.csv

# ---- Images -----------------------------------------------------------------

# Width in pixels a question's image is scaled down to before it is sent, if
# wider; 0 sends it as it is.
image.prep.width = 0

# Send the image in greyscale.
image.prep.greyscale = false
