# -----------------------------------------------------------------------------
# QTagger configuration: associates tags with the questions of the SConsole
# bank, one topic at a time. The models are configured in qtagger.ai.json
# (another file: -Dai.app.config=<file>).
#
# Every key is required. Any key can be overridden at launch with a JVM
# system property of the same name, e.g.
#   -Dserver.url=http://192.168.0.161:8080
# Paths may start with ~/ for the user's home directory; the files that hold
# the tagger's state may be given relative to workspace.dir.
# -----------------------------------------------------------------------------

# ---- SConsole server --------------------------------------------------------

#server.url = http://localhost:8080
server.url = http://192.168.0.161:8080/

# Seconds to wait for a connection, and for a whole request to complete.
server.connect.timeout.seconds = 5
server.request.timeout.seconds = 60

# ---- Files ------------------------------------------------------------------

# Root folder searched (recursively) for the source folders holding the
# question images.
question.bank.dir = /Users/sandeep/Documents/StudyNotes/question-bank

# The tag workspace, holding each topic's regression model and LLM prompt under
# topics/<subject>/<id>-<name>/cycles/<nn>-<kind>/output/. They are read from
# here each time a scope is set, from the topic's latest cycle, and never
# copied. Rebuilt files take effect the next time a scope is set.
tag.workspace.dir = /Users/sandeep/Documents/StudyNotes/question-bank/supporting-artefacts/tag-workspace

# The tesseract executable, for reading the questions' text. Its text must match
# what the topics' regression models were trained on, so keep to the build used
# for them (brew install tesseract; 5.5.1).
tesseract.bin = /opt/homebrew/bin/tesseract

# Questions read at once after a Load (1-16), each image with its own process.
ocr.threads = 4

# How long tesseract may take over one image.
ocr.timeout.seconds = 60

# Folder holding everything the tagger keeps: the files below (given relative
# to it) and its AI request / response transcripts, saved per attempt as
# <workspace.dir>/<source>/<questionId>/
# <time>-a<attempt>-openrouter-request.txt (and -response.txt). Separate from
# the classifier's and the reviewer's. Created at startup if missing.
workspace.dir = ~/projects/workspace/qtagger

# The scope last chosen (topic, batch size) and its load cursor.
scope.file = tagger-scope.json

# The settings made in File > Settings…
settings.file = tagger-settings.json

# Per question (by server id): the model's parsed reply, kept until the
# question's tags are saved on the server. A question with a reply here is not
# sent to the models again while its topic is unchanged.
pending.tagging.file = pending-tagging.json

# Every reply and every saved decision, one JSON object per line, only ever
# appended to. For audit; the tagger never reads it.
tag.audit.file = tag-audit.jsonl

# Deferrals, one JSON object per line.
tagger.notes.file = tagger-notes.jsonl

# Start times of the requests made today (UTC day), so the daily count
# survives a restart. Maintained by the tagger.
request.history.file = request.history.json

# One CSV row per AI attempt with the tokens it used and its cost.
usage.log.file = token-usage.csv

# ---- Images -----------------------------------------------------------------

# Width in pixels a question's image is scaled down to before it is sent, if
# wider; 0 sends it as it is.
image.prep.width = 0

# Send the image in greyscale.
image.prep.greyscale = false
