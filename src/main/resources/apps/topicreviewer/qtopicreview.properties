# -----------------------------------------------------------------------------
# QTopicReviewer configuration: re-checks the topic associations awaiting
# review on the SConsole server with a stronger model, and records the user's
# decisions back on the server. The models are configured in
# qtopicreview.ai.json (another file: -Dai.app.config=<file>).
#
# Every key is required (review.topic.ids may be blank). Any key can be
# overridden at launch with a JVM system property of the same name, e.g.
#   -Dreview.topic.ids=103
# Paths may start with ~/ for the user's home directory; the files the
# reviewer keeps may be given relative to workspace.dir.
# -----------------------------------------------------------------------------

# ---- SConsole server --------------------------------------------------------

#server.url = http://localhost:8080
server.url = http://192.168.0.161:8080/

# Seconds to wait for a connection, and for a whole request to complete.
server.connect.timeout.seconds = 5
server.request.timeout.seconds = 60

# ---- What to review ---------------------------------------------------------
#
# The starting search criteria, until others are saved in the reviewer (see
# review.criteria.file).

# Syllabus names (as the server knows them) whose questions awaiting review
# are fetched, comma-separated.
review.syllabus.names = IIT Physics, IIT Chemistry, IIT Maths

# Topic ids to review instead of the syllabuses above, comma-separated (blank:
# use the syllabuses). Handy for trying the reviewer on a small set.
review.topic.ids =

# Questions fetched per request to the review queue (1-500). The server always
# returns the first ones by id still awaiting review: confirmed questions drop
# out, so the next fetch brings the ones after them.
review.fetch.limit = 250

# ---- Files ------------------------------------------------------------------

# Root folder searched (recursively) for the source folders holding the
# question images.
question.bank.dir = /Users/sandeep/Documents/StudyNotes/question-bank

# Folder holding everything the reviewer keeps: the files below (given
# relative to it) and the AI request / response transcripts, saved per attempt
# as <workspace.dir>/<source>/<questionId>/<time>-a<attempt>-openrouter-request.txt
# (and -response.txt). Separate from the classifier's, so the transcripts
# don't mix. Created at startup if missing.
workspace.dir = ~/projects/workspace/qtopicreview

# Per question (by server id): the model's verdict, kept until the server
# takes a decision on the question and clears its review flag. A question
# with a verdict here is not sent to the model again while its topic on the
# server is unchanged.
pending.verdicts.file = pending-verdicts.json

# Every verdict and every decision the server took, one JSON object per line,
# only ever appended to. For audit; the reviewer never reads it.
review.audit.file = review-audit.jsonl

# The search criteria last saved with the Criteria... button (syllabuses,
# topics, batch size); used instead of review.syllabus.names,
# review.topic.ids and review.fetch.limit once saved. Delete the file to go
# back to those.
review.criteria.file = review-criteria.json

# Start times of the requests made today (UTC day), so the daily count
# survives a restart. Maintained by the reviewer.
request.history.file = request.history.json

# One CSV row per AI attempt with the tokens it used and its cost.
usage.log.file = token-usage.csv
