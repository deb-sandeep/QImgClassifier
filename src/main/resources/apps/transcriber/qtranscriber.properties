# -----------------------------------------------------------------------------
# QTranscriber configuration: transcribes the SConsole server's pending
# questions into markdown with Qwen (local, gated on its token log
# probabilities), Nemotron and GLM, and stores the transcriptions on the
# server. The AI models are configured apart, in qtranscriber.ai.json.
# See docs/feature-enhancements/2026-11-17/question-transcription/.
#
# Every key is required. Any key can be overridden at launch with a JVM
# system property of the same name, e.g.
#   -Dfetch.batch.size=20
# Paths may start with ~/ for the user's home directory; the files the app
# keeps may be given relative to workspace.dir.
# -----------------------------------------------------------------------------

# ---- SConsole server --------------------------------------------------------

#server.url = http://localhost:8080
server.url = http://192.168.0.161:8080/

# Seconds to wait for a connection, and for a whole request to complete.
server.connect.timeout.seconds = 5
server.request.timeout.seconds = 60

# ---- What to load -----------------------------------------------------------

# Questions fetched per Load (1-100), until the criteria saved in the app
# say otherwise.
fetch.batch.size = 50

# The criteria used until some are saved in the app (Criteria…): the
# syllabuses, and topic ids (comma-separated; when any are given, the server
# uses them instead of the syllabuses).
fetch.syllabus.names = IIT Physics, IIT Chemistry, IIT Maths
fetch.topic.ids =

# ---- The gate (logprob-confidence.md rev 3, calibration-results.md) --------

# C, Qwen's count of contested positions, is counted at this margin by the
# md-minor rule. It is recorded and orders spot checks.
gate.margin = 0.3

# True to send a Qwen transcription with C above gate.c.max to Nemotron.
# Off after calibration: only a malformed reply (or a failed request) leaves
# Qwen.
gate.route.on.c = false
gate.c.max = 0

# The prompt (classpath).
prompt.file = /apps/transcriber/qtranscriber.prompt

# ---- Files ------------------------------------------------------------------

# Root folder searched (recursively) for the source folders holding the
# question images.
question.bank.dir = /Users/sandeep/Documents/StudyNotes/question-bank

# Folder holding everything the app keeps (the files below, given relative
# to it). Created at startup if missing. One per server: the staged
# transcriptions, the audit log and the cursor are keyed by the server's
# question ids, which may differ between servers. The dev trial's is
# ~/projects/workspace/qtranscriber.
workspace.dir = ~/projects/workspace/qtranscriber-prod

# The search criteria in effect, restored at startup.
criteria.file = transcriber-criteria.json

# How many loads the last unattended run was allowed, offered for the next.
unattended.file = unattended.json

# Transcriptions accepted but not saved, reused on the next Load.
staged.file = staged-transcriptions.json

# LCT passages transcribed but not yet on the server.
held.passages.file = held-passages.json

# Every transcription accepted, save, mark and edit, one JSON object per
# line, only ever appended to.
audit.file = transcription-audit.jsonl

# Request times of the current UTC day, behind the AI models' per-day limits.
request.history.file = request.history.json

# One row per AI attempt with its token counts and cost.
usage.log.file = token-usage.csv
