# -----------------------------------------------------------------------------
# QImgClassifier application configuration.
#
# Every key is required (question.filter may be blank). Any key can be
# overridden at launch with a JVM system property of the same name, e.g.
#   -Dopenrouter.model=google/gemini-2.5-pro
# Paths may start with ~/ for the user's home directory; the files the
# application keeps may be given relative to workspace.dir.
# -----------------------------------------------------------------------------

# ---- Question bank ----------------------------------------------------------

# Root folder searched (recursively) for the source folders listed in
# qclassifier.sources.txt.
question.bank.dir = /Users/sandeep/Documents/StudyNotes/question-bank

# Debug filter on question ids: blank for all questions, a single letter for
# one subject (P, C or M), otherwise an exact base or part id (e.g. C_SCA_74).
question.filter =

# Folder holding everything the application keeps: the files below (given
# relative to it) and the AI request / response transcripts, saved per attempt
# as <workspace.dir>/<source>/<questionId>/<time>-a<attempt>-<agent>-request.txt
# (and -response.txt) and shown in the transcript panel when a question is
# selected. Created at startup if missing.
workspace.dir = ~/projects/workspace/qimgclassifier

# Sources whose every question has been classified, one per line. Maintained
# by the application.
processed.list.file = processed.list

# Start times of the requests made today (UTC day), per target with a
# per-day limit (rate.limit.rpd > 0), so the daily counts survive a restart.
# Maintained by the application; older entries are removed automatically.
request.history.file = request.history.json

# One CSV row per AI attempt: question, subject, model, outcome and the tokens
# it used (input, cached, output, reasoning, cost) - for estimating what a
# paid model would cost. Appended by the application.
usage.log.file = token-usage.csv

# ---- Gemma via Ollama -------------------------------------------------------

gemma.enabled = true
gemma.server.url = http://192.168.0.149:11434/api/generate
gemma.model = gemma4:latest

# Concurrent requests; match the server's OLLAMA_NUM_PARALLEL.
gemma.max.parallel = 5

# Comma-separated models tried, in order, on retries on this target after the
# primary model fails (blank: retries use the primary). Retries beyond the
# list wrap round to the primary; needs max.retries >= 1. For example:
#   gemma3:27b, llama3.2-vision
gemma.backup.models =

# Let the model reason before answering (true / false). The answer is a short
# topic list, so reasoning mostly adds output tokens and time; false asks the
# model not to (Ollama's "think" mode).
gemma.reasoning = false

# Retries a question may get on this target after a failed attempt on it
# (0 = one attempt only). A retry prefers the other target when it can take one.
gemma.max.retries = 1

# Seconds to wait for a connection, and for a whole request to complete.
gemma.connect.timeout.seconds = 10
gemma.request.timeout.seconds = 300

# Requests per minute and per UTC day, reset at 00:00 UTC (0 = no limit). A
# target at its limit gets no new requests until the window frees up.
gemma.rate.limit.rpm = 0
gemma.rate.limit.rpd = 0

# Seconds to pause the model after a "rate limit hit" (HTTP 429) that doesn't
# say how long to wait.
gemma.rate.limit.cooldown.seconds = 60

# ---- OpenRouter -------------------------------------------------------------

# Skipped (with an error logged) if the API key file is missing or empty.
openrouter.enabled      = true
openrouter.model        = nvidia/nemotron-3.5-super-vl:free
openrouter.max.parallel = 2

# File holding only the API key (relative to workspace.dir); kept outside the
# project on purpose.
openrouter.api.key.file = open-router.api.key

# Mark the (per-subject, unchanging) prompt as cacheable on models that
# support prompt caching, per OpenRouter's model list. Cached prompt tokens
# are billed at a fraction of the input price. Unsupported models (e.g. the
# :free ones) are sent as before.
openrouter.prompt.caching = true

# Comma-separated models tried, in order, on retries on this target after the
# primary model fails (blank: retries use the primary). Retries beyond the
# list wrap round to the primary; needs max.retries >= 1. For example:
#   google/gemini-2.5-pro, openai/gpt-4o
openrouter.backup.models = \
  google/gemma-4-31b-it:free, \
  google/gemma-4-26b-a4b-it:free

# Let the model reason before answering (true / false). The answer is a short
# topic list, so reasoning mostly adds output tokens and time; false asks the
# model not to (OpenRouter's "reasoning" option; true leaves it to the
# model's default).
openrouter.reasoning = false

# Retries a question may get on this target after a failed attempt on it
# (0 = one attempt only). A retry prefers the other target when it can take one.
openrouter.max.retries = 1

# Seconds to wait for a connection, and for a whole request to complete.
openrouter.connect.timeout.seconds = 10
openrouter.request.timeout.seconds = 180

# Requests per minute and per UTC day, reset at 00:00 UTC (0 = no limit). A
# target at its limit gets no new requests until the window frees up.
openrouter.rate.limit.rpm = 20
openrouter.rate.limit.rpd = 0

# Seconds to pause after a "rate limit hit" (HTTP 429) that doesn't say how
# long to wait. A model whose upstream provider is busy is paused on its own
# (attempts move to the next model in the list); a limit on the account
# (free-models-per-min / -per-day) pauses every OpenRouter model.
openrouter.rate.limit.cooldown.seconds = 300

# ---- QImgExtractor ----------------------------------------------------------

# Base URL of the running QImgExtractor's remote command API, used by
# "Show in QImgExtractor".
qimgextractor.api.url = http://127.0.0.1:8082
